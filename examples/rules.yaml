# ============================================================
# pdf_auto_marker ルール設定ファイル (サンプル)
# ============================================================

# 対象ページ (省略時は全ページ)。例: "1-3,5"
# pages: "1-3"

# 表の検出方法
#   lines        : 罫線から表を検出 (既定・罫線付きの表向け)
#   lines_strict : 罫線のみで検出 (塗りつぶし背景などを無視)
#   text         : 文字の並びから検出 (罫線のない表向け)
table:
  strategy: lines

# 全ルール共通の既定値 (各ルールで上書き可)
defaults:
  opacity: 0.4          # 透明度 (0 より大きく 1 以下)
  mode: contains        # contains: 部分一致 / exact: セル全体が一致 / regex: 正規表現
  case_sensitive: false # 英字の大文字・小文字を区別するか
  normalize: true       # 全角/半角の違いを無視するか (例: "ＮＧ" と "NG" を同一視)

# ------------------------------------------------------------
# 機能1: 表の中の指定単語を、任意の色でマーキング
# ------------------------------------------------------------
word_rules:
  - name: 要確認
    words: ["要確認"]
    color: "#FFFF00"          # 16進 / 色名 (yellow, 黄色 等) / [R, G, B] (0-255)

  - name: NG
    words: ["NG", "返品"]
    color: orange
    # columns: [5, 5]         # 検索する列を限定 (1始まり、省略時は全列)

# ------------------------------------------------------------
# 機能2: 行内に特定の文字がある場合、指定範囲の幅でその行をマーキング
# ------------------------------------------------------------
row_rules:
  - name: 不合格の行
    keywords: ["不合格"]
    color: [255, 120, 120]
    search_columns: [4, 4]    # キーワードを探す列 (省略時は全列)
    mark_columns: [2, 4]      # マーキングする列範囲 (省略時は行全体)。[2, -1] で 2列目〜最終列

  - name: 保留の行
    keywords: ["保留"]
    color: 水色
    mode: exact               # セルの内容が「保留」と完全一致する場合のみ
    # x_range: [60, 400]      # mark_columns の代わりに横位置を pt で直接指定も可
    padding: 0                # マーキング範囲の余白 (pt)
