name: Build Windows package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # タグ push 時のリリース作成に必要

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest reportlab

      - name: Run tests
        run: python -m pytest -q

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/pdf_auto_marker.spec

      - name: Add docs / sample and create zip
        run: python packaging/finalize_dist.py

      - name: Smoke test (CLI exe)
        shell: pwsh
        run: |
          $app = "dist\PdfAutoMarker"
          & "$app\pdf-auto-marker.exe" "$app\sample\sample.pdf" -c "$app\rules.yaml" -o smoke.pdf
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import pymupdf; n = len(list(pymupdf.open('smoke.pdf')[0].annots())); print('annotations:', n); assert n == 7"

      - name: Smoke test (GUI exe starts)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PdfAutoMarker\PdfAutoMarker.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "GUI exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI started successfully"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfAutoMarker-win64
          path: dist/PdfAutoMarker
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PdfAutoMarker-win64.zip
